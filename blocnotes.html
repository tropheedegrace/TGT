<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloc-notes du Culte - TGT</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #12161a; color: #e2e8f0; }
        .notes-area {
            width: 100%;
            height: 65vh;
            background: #fffdf9;
            color: #2d3748;
            border: 2px solid #ebdcb9;
            border-radius: 12px;
            padding: 15px;
            font-size: 1.1rem;
            line-height: 1.6;
            resize: none;
            outline: none;
            margin-top: 15px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }
        .status-badge {
            font-size: 0.75rem;
            color: var(--gold-bright);
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-content">
            <a href="index.html" style="color: white; text-decoration: none; font-size: 1.2rem;">⬅</a>
            <h1>Mon Bloc-notes du Culte</h1>
            <span></span>
        </div>
    </header>

    <main class="app-container">
        <!-- Zone de saisie libre pour le fidèle -->
        <textarea id="church-notes" class="notes-area" placeholder="Écrivez ici vos notes, les versets du jour et les citations du pasteur... Tout est sauvegardé automatiquement."></textarea>
        
        <div id="save-status" class="status-badge">✅ Sauvegarde automatique active</div>
    </main>

    <script>
        const zoneTexte = document.getElementById('church-notes');
        const statutSauvegarde = document.getElementById('save-status');

        // Charger les notes enregistrées au démarrage
        document.addEventListener("DOMContentLoaded", () => {
            const notesSauvegardees = localStorage.getItem("tgt_notes_fidele");
            if (notesSauvegardees) {
                zoneTexte.value = notesSauvegardees;
            }
        });

        // Écouter chaque lettre tapée pour sauvegarder en temps réel
        zoneTexte.addEventListener("input", () => {
            localStorage.setItem("tgt_notes_fidele", zoneTexte.value);
            statutSauvegarde.innerText = "⏳ Enregistrement en cours...";
            
            // Petit effet visuel de validation après 500ms
            setTimeout(() => {
                statutSauvegarde.innerText = "✅ Notes sauvegardées sur l'appareil";
            }, 600);
        });
    </script>

</body>
</html>
